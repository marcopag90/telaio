name: Coverage

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's own recommended group for Pages deployments: serializes deploys, but never
# cancels one mid-flight (a half-published site would be worse than a queued one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only tags trigger a real publish; workflow_dispatch is for a manual dry run.
  coverage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # REQUIRED REPO SETTING: the github-pages environment must allow deployments from tags.
    # It is created allowing only the default branch, so with a tag-only trigger the very first
    # release fails at the deploy step with "Tag vX.Y.Z is not allowed to deploy to github-pages
    # due to environment protection rules" — a rejection by the environment, invisible in the
    # workflow logs (it appears as a run annotation). Fix, once per repo:
    #   Settings -> Environments -> github-pages -> Deployment branches and tags
    #   -> Selected branches and tags -> Add rule: Tag `v*`   (plus Branch `main` if you want the
    #      workflow_dispatch dry run to be able to deploy as well).
    # After adding the rule, a rejected run can simply be re-run: the tagged commit is immutable,
    # so the recomputed coverage still matches what shipped.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Recomputed here rather than reused from ci.yml/publish.yml: publish.yml deploys
      # with -DskipTests, and ci.yml's own run happened on the release/* branch, not on
      # this tagged commit on main. This is the only way the coverage numbers are
      # guaranteed to correspond to exactly what got tagged.
      - name: Build and test
        run: mvn -B clean verify

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: telaio-coverage-report/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: telaio-coverage-report/target/site/jacoco-aggregate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: telaio-coverage-report/target/site/jacoco-aggregate

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
