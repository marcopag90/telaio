services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - telaio_showcase_pgdata:/var/lib/postgresql/data

  mongo:
    image: 'mongo:8'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    environment:
      MONGO_INITDB_DATABASE: telaio_showcase
    ports:
      - '27017:27017'
    volumes:
      - telaio_showcase_mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) } catch (e) {}; db.hello().isWritablePrimary ? quit(0) : quit(1)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

volumes:
  telaio_showcase_pgdata:
  telaio_showcase_mongodata:
